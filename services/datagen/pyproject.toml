[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagen"
version = "1.0.0"
description = "Deterministic synthetic Saudi/energy-sector HR and payroll generator"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
datagen = "datagen.__main__:main"

[tool.setuptools]
packages = ["datagen", "datagen.dimensions", "datagen.facts", "datagen.injection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
