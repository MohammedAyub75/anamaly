# ---------------------------------------------------------------------------
# Compose skeleton. Phase 0 defines the topology; the service images are built
# in the phases that own them (detector 3+, api 8, web 9), so `docker compose
# up` is only expected to work end to end from phase 14.
#
# `docker compose up postgres` works today and is all phases 1-7 need.
#
# Ollama is deliberately NOT here: it needs the host GPU, and the API is
# designed to start healthy without it (docs/LLM_PORTABILITY.md).
# ---------------------------------------------------------------------------
name: anomaly

services:

  postgres:
    image: postgres:16-alpine
    container_name: anomaly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anomaly}
      POSTGRES_USER: ${POSTGRES_USER:-anomaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anomaly_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anomaly} -d ${POSTGRES_DB:-anomaly}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  detector:
    build:
      context: ./services/detector
    container_name: anomaly-detector
    profiles: ["full"]          # phase 3+
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anomaly}:${POSTGRES_PASSWORD:-anomaly_dev_only}@postgres:5432/${POSTGRES_DB:-anomaly}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATA_ROOT: /data
      LOG_FORMAT: json
    volumes:
      - ./data:/data                    # the lake, bind-mounted (gitignored)
      - ./policy:/app/policy:ro         # policy is read-only to the runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama on the host
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
    container_name: anomaly-api
    profiles: ["full"]          # phase 8+
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anomaly}:${POSTGRES_PASSWORD:-anomaly_dev_only}@postgres:5432/${POSTGRES_DB:-anomaly}
      DETECTOR_BASE_URL: http://detector:8100
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_only}
      LOG_FORMAT: json
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: anomaly-web
    profiles: ["full"]          # phase 9+
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
