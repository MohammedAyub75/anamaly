# ---------------------------------------------------------------------------
# policy/sites.yaml — the site reference table (dim_site)
#
# 180 sites across all 13 administrative regions of Saudi Arabia. Geography is
# a genuine analytical dimension here, not a constant: `hardship_tier` and
# `remote_allowance_eligible` vary site by site, so the SAME allowance is
# legitimate at Shaybah and a policy violation at Dhahran. That discrimination
# is exactly what the detector must learn (anomaly codes A01, A02, A03).
#
# Attribute resolution
#   Each site inherits the booleans from `class_defaults[<class>]`. A key
#   written on the site itself overrides the class default. `hardship_tier`
#   and `headcount_weight` are always explicit — they are per-site facts, not
#   class facts.
#
# headcount_weight
#   Relative staffing weight used by the generator to distribute employees.
#   Deliberately skewed towards the Eastern Province, which is why every map
#   metric must normalise per 1,000 employees rather than plot raw counts.
#
# Coordinates are WGS84 (EPSG:4326) decimal degrees, matching the region
# polygons in policy/geo/sa_regions.geojson.
#
# Contract: docs/DATA_DICTIONARY.md -> dim_site. Gate: python tasks.py verify 0
# ---------------------------------------------------------------------------
version: 1
crs: EPSG:4326
currency: SAR

class_defaults:
  hq:            {remote_allowance_eligible: false, offshore_eligible: false, camp_available: false, family_housing_available: true,  rotation_supported: false}
  office:        {remote_allowance_eligible: false, offshore_eligible: false, camp_available: false, family_housing_available: true,  rotation_supported: false}
  medical:       {remote_allowance_eligible: false, offshore_eligible: false, camp_available: false, family_housing_available: true,  rotation_supported: false}
