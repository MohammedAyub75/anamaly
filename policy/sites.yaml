  plant:         {remote_allowance_eligible: false, offshore_eligible: false, camp_available: true,  family_housing_available: true,  rotation_supported: false}
  terminal:      {remote_allowance_eligible: false, offshore_eligible: false, camp_available: true,  family_housing_available: false, rotation_supported: false}
  depot:         {remote_allowance_eligible: false, offshore_eligible: false, camp_available: false, family_housing_available: false, rotation_supported: false}
  drilling_camp: {remote_allowance_eligible: true,  offshore_eligible: false, camp_available: true,  family_housing_available: false, rotation_supported: true}
  offshore:      {remote_allowance_eligible: true,  offshore_eligible: true,  camp_available: true,  family_housing_available: false, rotation_supported: true}
